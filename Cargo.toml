[package]
name = "triage"
version = "0.1.0"
edition = "2024"
description = "One decision inbox for agent sessions in tmux and scheduled jobs"
authors = ["Nick <271549447+nick-maderight@users.noreply.github.com>"]
repository = "https://github.com/nick-maderight/triage"
license = "MIT"
rust-version = "1.89"

[dependencies]
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
libc = "0.2"
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.28.0", features = ["v4"] }
